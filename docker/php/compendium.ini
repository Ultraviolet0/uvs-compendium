; Local development PHP settings. Production uses the host's PHP configuration;
; see docs/deployment.md for the values the application expects.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
session.use_strict_mode = 1
session.use_only_cookies = 1

name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Builds the runtime vendor/ directory with the pinned PHP image used for testing.
      RUNTIME_COMPOSER: docker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Runtime guide dates come from each page's last Git commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Build the local PHP image
        run: docker compose build web
      - name: Validate Composer metadata and install locked dependencies
        run: |
          docker compose run --rm --no-deps composer validate --strict
          docker compose run --rm --no-deps composer install --no-interaction --no-progress --prefer-dist
      - name: Audit Composer dependencies for known vulnerabilities
        run: docker compose run --rm --no-deps composer audit --locked --no-interaction
      - name: Start the site, test service, and disposable MariaDB
        run: docker compose up -d --wait
      - name: Apply migrations to the development database
        run: docker compose exec -T -u www-data web php bin/console migrate
      - name: Validate site, PHP unit/integration tests, and end-to-end flows
        run: npm test
        env:
          PHP_LINT_CONTAINER: '1'
      - name: Validate packaged site as Apache document root
        run: npm run test:runtime
      - if: always()
        run: docker compose down --volumes
